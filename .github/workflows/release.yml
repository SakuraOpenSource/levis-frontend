name: Release

# 两种触发方式（与后端仓库保持一致）：
#   - 手动：在 Actions 页面填 Release 标签与名称，构建完自动建 tag 与 Release
#   - 推 tag：`git tag v0.1.0 && git push --tags`，名称取 tag 本身
#
# 正常交付路径是后端仓库把本项目的产物 go:embed 进单文件二进制，这里发布的
# 压缩包是给需要单独部署前端（自行配 Nginx 反代 /api）的场景用的。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release 标签，如 v0.1.0（不存在时会在当前提交上创建）'
        required: true
      name:
        description: 'Release 名称，留空则与标签相同'
        required: false
      prerelease:
        description: '标记为预发布版本'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布前端产物
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # 两种触发方式的标签来源不同，先归一化，后面的步骤只认这里的输出。
      # 输入值经 env 传入而不是直接插进脚本，避免带引号的输入把命令拼坏。
      - name: 解析发布信息
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_NAME: ${{ inputs.name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi

          # 压缩包名与 Release 都带上它，先挡住手滑输入。
          case "$tag" in
            v[0-9]*) ;;
            *) echo "标签需形如 v0.1.0，当前为：$tag"; exit 1 ;;
          esac

          name="${INPUT_NAME:-$tag}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "将发布 $tag（名称：$name）"

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # build 脚本本身是 vue-tsc -b && vite build，类型检查已包含在内，
      # 因此类型不过的代码不会被发布出去。
      - run: pnpm build

      - name: 打包产物
        id: pack
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          test -f dist/index.html
          mkdir -p bin/release

          # 归档里保留 dist/ 这层目录：解压时不会把一堆文件散进当前目录。
          # 同时提供 tar.gz 与 zip，Windows 上不必先装解压工具。
          base="levis-frontend-${TAG}"
          tar -czf "bin/release/${base}.tar.gz" dist
          zip -qr "bin/release/${base}.zip" dist

          cd bin/release
          sha256sum levis-frontend-* > checksums.txt
          ls -lh

      - name: 上传构建产物
        uses: actions/upload-artifact@v5
        with:
          name: levis-frontend-dist
          path: bin/release/*

      # tag 不存在时由这一步在 target_commitish 上创建，因此手动触发无需先打 tag。
      # 说明由 GitHub 自动生成（对比上一个 Release 的提交与 PR）。
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: bin/release/*
